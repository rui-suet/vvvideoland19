<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vv的小宇宙</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #ffe6f0, #e6f7ff);
  color: #4A3F35;
  text-align: center;
  min-height: 100vh;
  cursor: pointer;
  overflow-y: auto; /* ⭐ 如果抽到长图，允许有滚动条，体验更好 */
  overflow-x: hidden;
  display: flex;
  justify-content: center; /* 水平居中 */
  align-items: center;     /* 垂直居中 */
}

/* 清除默认边距，保证第一页完美居中 */
h1, p {
  margin: 0;
  padding: 0;
}

/* 给第一页加一个独立包裹框，确保其在body中被当成一个整体完美全屏居中 */
#welcome-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: opacity 0.6s ease;
}

p {
  margin-top: 15px; /* 让小字和标题产生一点点好看的间距 */
  font-size: 18px;
}

h1 {
  font-size: 64px;
  color: transparent;
  -webkit-text-stroke: 1.5px white;
  letter-spacing: 2px;
  font-weight: 300;
  text-shadow: 0 0 10px rgba(255,255,255,0.3);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
  100% { transform: translateY(0px); }
}
  
/* 背景动效 */
body::before {
  content: "";
  position: fixed;
  left: 0; top: 0;
  width: 200%;
  height: 200%;
  background-size: 36px 36px; /* 间距变大 */
  background-image: radial-gradient(#c8a27c 2px, transparent 2px); /* 点变大 */
  opacity: 0.2;
  animation: floatBg 30s linear infinite;
  z-index: -1;
}

@keyframes floatBg {
  from { transform: translate(0,0); }
  to { transform: translate(-100px,-100px); }
}

/* 开场提示 */
#start {
  margin-top: 35px; /* 提示字往下稍微挪一点 */
  font-size: 24px;
  line-height: 1.8;
  opacity: 0.8;
}

.button-group {
  display: flex;
  justify-content: center;
  flex-wrap: wrap; /* ⭐ 手机屏幕小的时候允许换行，更好看 */
  gap: 10px;
}

/* 主界面 */
#main {
  display: none;
  opacity: 0;
  transform: translateY(10px);
  /* 为了让第二页在body里也完美居中，当它显示时我们也采用flex列布局 */
  flex-direction: column;
  align-items: center;
}

.show {
  display: flex !important; /* 激活时强制使用flex排列 */
  animation: fadeIn 0.8s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.hint {
  font-size: 12px;
  color: #c8a27c;
  margin-top: 10px;
  margin-bottom: 10px;
  opacity: 0.7;
}

/* 按钮呼吸 */
button {
  background-color: #7ED1C6;
  border: none;
  padding: 12px 20px;
  margin: 5px;
  border-radius: 20px;
  color: white;
  font-size: 14px;
  cursor: pointer;
  animation: breathe 3s infinite;
  transition: background-color 0.3s;
}

@keyframes breathe {
  0%,100% { opacity: 0.9; }
  50% { opacity: 1; }
}

button:hover {
  background-color: #4A3F35;
}

/* 文本 */
#output {
  margin-top: 30px;
  white-space: pre-line;
  line-height: 1.8;
  max-width: 90vw; /* 限制宽度防止手机上溢出 */
}

.drop-img {
  margin-top: 10px;
  max-width: 220px;
  border-radius: 10px;
}

img {
  width: 80%;
  max-width: 300px;
  border-radius: 16px;
  margin: 20px auto;
  transition: transform 0.3s ease;
}

img:hover {
  transform: scale(1.05);
}
  
/* ⭐ 彩蛋 */
#starBelow {
  margin-top: 20px;
  font-size: 22px;
  display: none;
  cursor: pointer;
}

.blink {
  animation: starBlink 1.5s infinite;
}

@keyframes starBlink {
  0%,100% { opacity: 0.4; }
  50% { opacity: 1; }
}

#starHint {
  font-size: 12px;
  color: #c8a27c;
  margin-top: 8px;
  display: none;
  opacity: 0.7;
}

/* 🎬 视频 */
#videoBox {
  margin-top: 20px;
  display: none;
  opacity: 0;
}

.showVideo {
  animation: fadeVideo 1s ease forwards;
}

@keyframes fadeVideo {
  from { opacity: 0; }
  to { opacity: 1; }
}

video {
  max-width: 300px;
  border-radius: 12px;
}
</style>
</head>

<body>
  
<!-- 🌟 这里增加了大包裹框，把第一页内容打包，解决了偏上不居中的问题 -->
<div id="welcome-section">
  <h1>Happy Birthday, my vv</h1>
  <p>for all the little moments that make you you</p>
   
  <div id="start">
    诶？这是什么地方？<br>
    要点击空白处嘛？？？？
  </div>
</div>

<!-- 主内容区域（移除了之前不小心重复复制的代码段） -->
<div id="main">
  <!-- 按钮一整行 -->
  <div class="button-group">
    <button onclick="cake(event)">🍰 点一下蛋糕</button>
    <button onclick="mood(event)">🎧 今日心情</button>
    <button onclick="randomDrop(event)">📦 随机掉落</button>
    <button onclick="letter(event)">💌 打开一封信</button>
  </div>
  
  <!-- 提示语放在按钮组下面 -->
  <div class="hint">✨ 多点几下试试，说不定有其他掉落呢？</div>

  <div id="output"></div>
  <div id="starBelow" onclick="secret(event)">⭐</div>
  <div id="starHint">嗯？有彩蛋吗？那在哪里呢？</div>

  <!-- 🎬视频位置 -->
  <div id="videoBox">
    <video controls>
      <source src="推し活香槟call4v.mp4" type="video/mp4">
    </video>
  </div>
</div>

<script>
window.onload = function() {
  // 绑定全局点击事件用于开场进入
  document.addEventListener("click", enterPageOnce);
};

function enterPageOnce() {
  enterPage();
  document.removeEventListener("click", enterPageOnce);
}

function enterPage() {
  const welcome = document.getElementById("welcome-section");
  const main = document.getElementById("main");

  // 让第一页文字整体淡出
  welcome.style.opacity = "0";

  setTimeout(() => {
    welcome.style.display = "none"; // 彻底移除第一页文字
    main.classList.add("show");     // 优雅淡入第二页的四个按钮并完美居中
  }, 600);
}

/* 🍰 */
function cake(e) {
  e.stopPropagation(); // 阻止事件冒泡
  hideStar();
  hideVideo();
  document.getElementById("output").innerText = "健身暂停！今天允许摄入甜食！";
}

/* 🎧 */
const moods = [
"今天的你：值得被请喝一杯奶茶",
"今天的你：可以放下工作早睡1小时",
"今天的你：快去金沙湖看日落",
"今天的你：请买一张去合肥的车票",
"今天的你：请来zufe找我吃饭",
"今天的你：必须去教学楼下摸摸小猫",
"今天的你：最好现在去听一次ode to love",
"今天的你：要大冒险给俞锋发一张自拍，不行的话给我发10张"
];

function mood(e) {
  e.stopPropagation();
  hideStar();
  hideVideo();
  const random = moods[Math.floor(Math.random() * moods.length)];
  document.getElementById("output").innerText = random;
}

/* 📦 */
const drops = [
  { type: "text", content: "我要吃滨寿司！" },
  { type: "text", content: "今天我96斤啦！！！" },
  { type: "text", content: "去盒马吃三明治！" },
  { type: "text", content: "去黄山吧～" },
  { type: "text", content: "奶油火鸡面不放奶油…？" },
  { type: "text", content: "爆破专家我吃吃吃吃吃吃吃吃吃吃吃吃吃！" },
  { type: "text", content: "小烟熏赢麻了^ ^" },
  { type: "text", content: "我们都在用力滴活着" },
  { type: "text", content: "我们马上要成为会计师了好吗" },
  { type: "text", content: "求泳帽不变尖教程！" },
  { type: "text", content: "我不行了。。" },
  { type: "text", content: "12306我恨你" },
  { type: "text", content: "保持眼睛干燥。保持苹果肌扁平。" },
  { type: "text", content: "💣💩" },
  { type: "text", content: "好利来真不会做生意。" },
  { type: "text", content: "海底捞你的兵来了！" },
  { type: "text", content: "你的背包～～～～～" },
  { type: "text", content: "满意hk的礼物吗……(^L^)" },

  { type: "img", content: "vvv1.jpg" },
  { type: "img", content: "vvv2.jpg" },
  { type: "img", content: "vvv3.jpg" },
  { type: "img", content: "vvv4.jpg" },
  { type: "img", content: "vvv5.jpg" },
  { type: "img", content: "vvv6.jpg" },
  { type: "img", content: "vvv7.jpg" },
  { type: "img", content: "vvv8.jpg" },
  { type: "img", content: "vvv9.jpg" },
  { type: "img", content: "vvv10.jpg" },
  { type: "img", content: "vvv11.jpg" },
  { type: "img", content: "vvv12.jpg" },
  { type: "img", content: "vvv13.jpg" },
  { type: "img", content: "vvv14.jpg" },
  { type: "img", content: "vvv15.jpg" },
  { type: "img", content: "vvv16.jpg" }
];

function randomDrop(e) {
  e.stopPropagation();
  hideStar();
  hideVideo();

  const random = drops[Math.floor(Math.random() * drops.length)];

  if (random.type === "text") {
    document.getElementById("output").innerText = random.content;
  } else if (random.type === "img") {
    document.getElementById("output").innerHTML = "<img src='" + random.content + "' class='drop-img'>";
  }
}

/* 💌 */
function letter(e) {
  e.stopPropagation();
  hideStar();
  hideVideo();

  document.getElementById("output").innerText =
`不知不觉，是给vv过的第三个生日啦。
所以vv是3岁。
开玩笑，作为19岁的前辈，
我想告诉你，
19岁一定比18岁精彩太多，
世界属于你。
而且19，
是青春里球衣的号码嘛^_^
生日快乐，vv`;

  setTimeout(() => {
    const star = document.getElementById("starBelow");
    const hint = document.getElementById("starHint");

    star.style.display = "block";
    hint.style.display = "block";
    star.classList.add("blink");
  }, 5000);
}

/* ⭐最终彩蛋 */
function secret(e) {
  e.stopPropagation();
  document.getElementById("output").innerText = "在这里吃了蛋糕，那么吃饭的时候…？";

  const video = document.getElementById("videoBox");
  video.style.display = "block";
  video.classList.add("showVideo");
}

/* 工具函数 */
function hideStar() {
  const star = document.getElementById("starBelow");
  star.style.display = "none";
  star.classList.remove("blink");

  document.getElementById("starHint").style.display = "none";
}

// 隐藏视频并暂停播放
function hideVideo() {
  const videoBox = document.getElementById("videoBox");
  videoBox.style.display = "none";
  videoBox.classList.remove("showVideo");
  const v = videoBox.querySelector("video");
  if(v) { v.pause(); }
}
</script>

</body>
</html>
